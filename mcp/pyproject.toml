[project]
name = "bestpred-mcp"
version = "0.2.0"
description = "USDA's best prediction of dairy lactation yields (BESTPRED) as tools any AI agent can call: an MCP server for Claude, ChatGPT, Codex, Cursor, VS Code and Gemini CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["bestpred>=0.2.0", "mcp>=2.3,<3"]
keywords = ["dairy", "lactation", "best prediction", "dhi", "mcp", "ai agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

[project.scripts]
bestpred-mcp = "bestpred_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/padge01/bestpred-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bestpred_mcp"]

[tool.uv.sources]
bestpred = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
