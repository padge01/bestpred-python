# What the plugin runs: the bestpred-mcp server from PyPI, every package pinned with hashes in uv.lock beside this file.
[project]
name = "bestpred-plugin"
version = "0.2.1"
description = "The pinned runtime for the BESTPRED plugin's MCP server."
requires-python = ">=3.12"
dependencies = ["bestpred-mcp==0.2.1"]

[tool.uv]
package = false
