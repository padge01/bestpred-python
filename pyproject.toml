[project]
name = "bestpred"
version = "0.1.0"
description = "USDA's best prediction of dairy lactation yields and persistency (BESTPRED 2.0rc7), ported to Python and checked against the original."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["dairy", "lactation", "best prediction", "dhi", "animal science", "usda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest"]
validation = ["pandas"]

[project.scripts]
bestpred = "bestpred.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bestpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/padge01/bestpred-python"
Original = "https://github.com/wintermind/bestpred"
